# CI/CD uses GitHub OIDC → AWS IAM (for ECR + EKS API only). This is NOT IRSA.
# IRSA is for Pods inside EKS (app + External Secrets Operator). Do not confuse the two.
#
# Non-sensitive deploy identifiers: set as Repository/Organization Variables (vars.*).
# Sensitive: OIDC role ARN and CI test DB/S3 — keep as Secrets.
#
name: Backend CI/CD

on:
  push:
    branches: [feature/ai]
  pull_request:
    branches: [feature/ai]

jobs:
  ci:
    name: CI (Build, Docker)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DB_URL }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          echo "Building image $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    name: Deploy to Kubernetes
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity (OIDC check)
        run: aws sts get-caller-identity

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig (EKS)
        run: |
          mkdir -p $HOME/.kube
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Debug cluster access
        run: |
          kubectl version --client
          kubectl config current-context
          kubectl get nodes

      - name: Debug ESO installation
        run: |
          echo "=== Checking Helm releases ==="
          helm list -n external-secrets
          
          echo "=== Checking pods in external-secrets namespace ==="
          kubectl get pods -n external-secrets || echo "Namespace not found"
          
          echo "=== Checking CRDs ==="
          kubectl get crd | grep external-secrets || echo "No ESO CRDs found"
          
          echo "=== Checking API versions ==="
          kubectl api-versions | grep external-secrets || echo "external-secrets API not available"

      - name: Install External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --set installCRDs=true \
            --wait \
            --timeout 5m
          
          # Verify installation
          kubectl get crd | grep external-secrets
          kubectl get pods -n external-secrets

      - name: Annotate ESO service account with IRSA role
        run: |
          # Annotate service account
          kubectl annotate serviceaccount external-secrets -n external-secrets \
            eks.amazonaws.com/role-arn=${{ secrets.ESO_IRSA_ROLE_ARN }} \
            --overwrite
          
          # Delete pods (they will recreate automatically with new role)
          kubectl delete pods -n external-secrets --all
          
          # Wait for pods to be ready
          echo "Waiting for ESO pods to restart with IRSA role..."
          sleep 5
          kubectl wait --for=condition=ready --timeout=120s pod --all -n external-secrets
          
          # Verify pods are running
          kubectl get pods -n external-secrets
          
          echo "ESO successfully configured with IRSA role"

      - name: Debug ESO IRSA thoroughly
        run: |
          echo "=== 1. Check ESO service account annotation ==="
          kubectl get serviceaccount external-secrets -n external-secrets -o yaml | grep -A 2 "annotations:"
          
          echo "=== 2. Check if token is mounted in ESO pod ==="
          ESO_POD=$(kubectl get pods -n external-secrets -o name | head -1)
          kubectl exec $ESO_POD -n external-secrets -- ls -la /var/run/secrets/eks.amazonaws.com/ 2>/dev/null || echo "❌ TOKEN NOT MOUNTED"
          
          echo "=== 3. Check token contents (first 100 chars) ==="
          kubectl exec $ESO_POD -n external-secrets -- cat /var/run/secrets/eks.amazonaws.com/token 2>/dev/null | head -c 100 || echo "No token"
          
          echo "=== 4. Check ESO pod logs for AWS errors ==="
          kubectl logs $ESO_POD -n external-secrets --tail=50
          
          echo "=== 5. Check ClusterSecretStore details ==="
          kubectl describe clustersecretstore aws-parameterstore | grep -A 20 "Status:"
          kubectl describe clustersecretstore aws-secretsmanager | grep -A 20 "Status:"
          
          echo "=== 6. Check if OIDC provider exists ==="
          aws eks describe-cluster --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }} --query "cluster.identity.oidc.issuer" --output text


      - name: Wait for ESO CRDs
        run: |
          echo "Waiting for ClusterSecretStore CRD..."
          kubectl wait --for=condition=established --timeout=60s crd/clustersecretstores.external-secrets.io
              
          echo "Waiting for ExternalSecret CRD..."
          kubectl wait --for=condition=established --timeout=60s crd/externalsecrets.external-secrets.io
              
          echo "All CRDs are ready!"

      - name: Apply Kubernetes manifests
        run: kubectl apply -f kubernetes/

      - name: Fix backend-config type (ConfigMap → Secret)
        run: |
          # Delete the old ConfigMap
          kubectl delete configmap backend-config --ignore-not-found=true
          
          # Delete the ExternalSecret to force recreation
          kubectl delete externalsecret backend-config --ignore-not-found=true
          
          # Reapply the ExternalSecret
          kubectl apply -f kubernetes/externalsecret-backend-config.yaml
          
          # Wait for the Secret to be created
          echo "Waiting for Secret to be created..."
          for i in {1..30}; do
            if kubectl get secret backend-config &>/dev/null; then
              echo "✓ Secret backend-config created"
              break
            fi
            sleep 2
          done
          
          kubectl get secret backend-config

      - name: Wait for ClusterSecretStores to be ready
        run: |
          echo "Waiting for ClusterSecretStores to become ready..."
          for i in {1..20}; do
            PARA_READY=$(kubectl get clustersecretstore aws-parameterstore -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
            SECRET_READY=$(kubectl get clustersecretstore aws-secretsmanager -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
            
            if [ "$PARA_READY" = "True" ] && [ "$SECRET_READY" = "True" ]; then
              echo "✓ ClusterSecretStores are ready!"
              break
            fi
            echo "Attempt $i: ParameterStore=$PARA_READY, SecretsManager=$SECRET_READY"
            sleep 10
          done
          
          echo "Final ClusterSecretStore status:"
          kubectl get clustersecretstore


      - name: Debug current pod status and secrets
        run: |
          echo "=== Current pods before update ==="
          kubectl get pods -l app=ecoloop-backend
          
          echo "=== Check if ExternalSecrets are ready ==="
          kubectl get externalsecret
          kubectl describe externalsecret backend-config
          kubectl describe externalsecret backend-env
          
          echo "=== Check if secrets were created ==="
          kubectl get secret | grep -E "backend-config|backend-env"
          
          echo "=== Check ClusterSecretStore status ==="
          kubectl get clustersecretstore
          kubectl describe clustersecretstore aws-parameterstore
          kubectl describe clustersecretstore aws-secretsmanager
          
          echo "=== Check pod events ==="
          kubectl get events --sort-by='.lastTimestamp' | tail -30

      - name: Wait for ESO Secrets to be created
        run: |
          echo "Waiting for backend-config Secret..."
          for i in {1..30}; do
            if kubectl get secret backend-config &>/dev/null; then
              echo "✓ Secret backend-config created"
              break
            fi
            echo "Attempt $i: Waiting for Secret backend-config..."
            sleep 5
          done
          
          echo "Waiting for backend-env Secret..."
          for i in {1..30}; do
            if kubectl get secret backend-env &>/dev/null; then
              echo "✓ Secret backend-env created"
              break
            fi
            echo "Attempt $i: Waiting for Secret backend-env..."
            sleep 5
          done
          
          echo "All Secrets are ready!"
          kubectl get secret backend-config backend-env
      - name: Verify both ConfigMaps and Secret are ready
        run: |
          echo "=== Checking all required resources ==="
          
          # Check static ConfigMap
          if kubectl get configmap backend-configs &>/dev/null; then
            echo "✓ backend-configs (static) exists"
          else
            echo "⚠️ backend-configs not found - creating from .env"
            # Create from .env file if it exists in your repo
            if [ -f .env ]; then
              kubectl create configmap backend-configs --from-env-file=.env --dry-run=client -o yaml | kubectl apply -f -
            fi
          fi
          
          # Check ESO ConfigMap
          if kubectl get secret backend-config &>/dev/null; then
            echo "✓ backend-config (ESO/SSM) exists"
          else
            echo "❌ backend-config not found!"
            exit 1
          fi
          
          # Check Secret
          if kubectl get secret backend-env &>/dev/null; then
            echo "✓ backend-env (ESO/SecretsManager) exists"
          else
            echo "❌ backend-env not found!"
            exit 1
          fi
          
          echo "All resources ready!"

      - name: Clean up old failing pods
        run: |
          echo "Cleaning up old pods that may have cached errors..."
          # Delete old pods that reference the old configmap
          kubectl delete pod -l app=ecoloop-backend --field-selector=status.phase=Failed --ignore-not-found=true
          kubectl delete pod -l app=ecoloop-backend --field-selector=status.phase=Pending --ignore-not-found=true
          
          # Specifically delete the old problematic pods
          kubectl delete pod ecoloop-backend-6fcdb885f-g8ttl --ignore-not-found=true
          kubectl delete pod ecoloop-backend-6b644b466c-c5brf --ignore-not-found=true
          
          echo "Waiting for cleanup..."
          sleep 10

      - name: Check application logs before update
        run: |
          echo "=== Checking logs from current pods (if any) ==="
          NEW_POD=$(kubectl get pods -l app=ecoloop-backend --sort-by=.metadata.creationTimestamp -o name 2>/dev/null | tail -1)
          if [ -n "$NEW_POD" ]; then
            echo "Pod: $NEW_POD"
            echo ""
            echo "=== Current logs ==="
            kubectl logs $NEW_POD --tail=50 2>/dev/null || echo "No logs available"
          fi

      - name: Update Kubernetes deployment image
        env:
          ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Deploying image $IMAGE"

          kubectl set image deployment/ecoloop-backend backend=$IMAGE

          echo "Waiting for rollout (timeout: 5 minutes)..."
          kubectl rollout status deployment/ecoloop-backend --timeout=5m || {
            echo "Rollout failed. Checking pod status..."
            kubectl get pods -l app=ecoloop-backend
            echo ""
            echo "=== Pod logs ==="
            NEW_POD=$(kubectl get pods -l app=ecoloop-backend --sort-by=.metadata.creationTimestamp -o name | tail -1)
            kubectl logs $NEW_POD --tail=100 2>/dev/null || echo "No logs available"
            echo ""
            echo "=== Pod events ==="
            kubectl describe pods -l app=ecoloop-backend | grep -A 20 "Events:"
            exit 1
          }
          
          echo "Deployment successful!"

      - name: Debug ConfigMap and Secret
        run: |
          echo "=== Check all ConfigMaps in default namespace ==="
          kubectl get configmap
          
          echo "=== Check backend-config specifically ==="
          kubectl get secret backend-config -o yaml || echo "ConfigMap not found"
          
          echo "=== Check all Secrets in default namespace ==="
          kubectl get secret
          
          echo "=== Check backend-env specifically ==="
          kubectl get secret backend-env -o yaml || echo "Secret not found"
          
          echo "=== Check deployment envFrom references ==="
          kubectl get deployment ecoloop-backend -o yaml | grep -A 20 "envFrom"
