# ClusterSecretStore: cluster-wide AWS Secrets Manager connection for External Secrets Operator (ESO).
#
# - This store is NOT populated by Terraform outputs in Git; Terraform writes secrets to AWS,
#   and ESO reads them at runtime. Kubernetes is the consumer of AWS.
# - Authentication uses IRSA: the ESO controller Pod's ServiceAccount must be annotated with
#   an IAM role that can secretsmanager:GetSecretValue on your secrets.
# - Replace region with your AWS region (e.g. us-east-2).
# - Replace serviceAccountRef with the SA your ESO Helm install uses (often external-secrets
#   in namespace external-secrets). This is separate from the application Pod's ecoloop-backend SA.
#
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
