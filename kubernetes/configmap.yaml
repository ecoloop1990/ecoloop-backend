apiVersion: v1
kind: ConfigMap
metadata:
  name: ecoloop-config
  namespace: ecoloop

data:
  NODE_ENV: "production"
  PORT: "5000"
  API_VERSION: "v1"

  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "ecoloop-s3-buckets"

  AI_SERVICE_URL: "http://ecoloop-ai-service"
  AI_SERVICE_TIMEOUT: "3000"

  FRONTEND_URL: "https://ecoloop-frontend-dab6.onrender.com"
  CORS_ORIGIN: "https://ecoloop-frontend-dab6.onrender.com"

  LOG_LEVEL: "info"

  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"