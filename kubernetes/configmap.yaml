apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-configs
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "5000"
  API_VERSION: "v1"
  AWS_REGION: "us-east-1"
  JWT_EXPIRES_IN: "7d"
  CORS_ORIGIN: "https://ecoloop-frontend-dab6.onrender.com"
  AI_SERVICE_URL: "http://ecoloop-ai-service.default.svc.cluster.local:8000"
  AI_SERVICE_TIMEOUT: "3000"
  LOG_LEVEL: "info"
  FRONTEND_URL: "https://ecoloop-frontend-dab6.onrender.com"
  RATE_LIMIT_MAX_REQUESTS: "100"  
  RATE_LIMIT_WINDOW_MS: "900000"
