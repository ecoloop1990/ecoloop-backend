# ClusterSecretStore: cluster-wide AWS Systems Manager Parameter Store connection for ESO.
#
# - Use this for non-sensitive configuration under a path prefix (e.g. /ecoloop/prod/*).
# - Same IRSA pattern as Secrets Manager: ESO controller SA must have ssm:GetParameters* (and
#   kms:Decrypt if parameters use CMK).
# - Replace region to match your infrastructure.
#
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameterstore
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
