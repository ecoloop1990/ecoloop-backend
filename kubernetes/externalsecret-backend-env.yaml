# ExternalSecret → Kubernetes Secret "backend-env" (created and refreshed by ESO; no manual kubectl secret).
#
# Flow: Terraform → AWS Secrets Manager (secret JSON: ecoloop-backend-core)
#       → ESO → Secret backend-env → Deployment envFrom → container env (DATABASE_URL, JWT_SECRET, …)
#
# The Secret is dynamic: ESO reconciles on refreshInterval. No copying Terraform outputs into YAML.
#
# Prerequisites:
# - External Secrets Operator installed in the cluster
# - ClusterSecretStore aws-secretsmanager applied
# - Secret ecoloop-backend-core exists in Secrets Manager as JSON with the listed properties
# - IAM policy on ESO IRSA role allows secretsmanager:GetSecretValue for that secret ARN
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-env
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: backend-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Sensitive values — sourced only from Secrets Manager
    - secretKey: DATABASE_URL
      remoteRef:
        key: ecoloop-backend-core
        property: DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: ecoloop-backend-core
        property: JWT_SECRET
