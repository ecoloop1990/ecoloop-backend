# Application Pod identity (IRSA) for S3, CloudWatch, etc.
# This is NOT the ServiceAccount used by External Secrets Operator to read Secrets Manager / SSM.
# ESO uses its own controller SA (see clustersecretstore-*.yaml serviceAccountRef).
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecoloop-backend
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::632150488624:role/ecoloop-backend-irsa"
