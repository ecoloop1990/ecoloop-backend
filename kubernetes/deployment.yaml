apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecoloop-backend
  labels:
    app: ecoloop-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ecoloop-backend
  template:
    metadata:
      labels:
        app: ecoloop-backend
    spec:
      containers:
      - name: ecoloop-backend
        image: ecoloop-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ecoloop-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ecoloop-secrets
              key: jwt-secret
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: ecoloop-secrets
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: ecoloop-secrets
              key: aws-secret-access-key
        - name: S3_BUCKET_NAME
          value: "ecoloop-images"
        - name: AI_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: ecoloop-config
              key: ai-service-url
        - name: AI_SERVICE_TIMEOUT
          value: "3000"
        - name: LOG_LEVEL
          value: "info"
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: ecoloop-config
              key: cors-origin
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ecoloop-backend-service
spec:
  selector:
    app: ecoloop-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: LoadBalancer

