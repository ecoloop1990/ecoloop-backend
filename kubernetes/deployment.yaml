# Deployment: no env vars inlined — all config comes from Kubernetes objects populated by ESO:
#   - Secret backend-env (Secrets Manager via externalsecret-backend-env.yaml)
#   - ConfigMap backend-config (SSM via externalsecret-backend-config.yaml)
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecoloop-backend
  namespace: default
  labels:
    app: ecoloop-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecoloop-backend
  template:
    metadata:
      labels:
        app: ecoloop-backend
    spec:
      serviceAccountName: ecoloop-backend
      containers:
      - name: backend
        image: "632150488624.dkr.ecr.us-east-1.amazonaws.com/ecoloop-backend:latest"
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        # Order: config first, then secrets — JWT_SECRET / DATABASE_URL override if keys ever overlap
        - configMapRef:
            name: backend-configs 
        - secretRef:
            name: backend-config 
        - secretRef:
            name: backend-env
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"