# ExternalSecret → Kubernetes ConfigMap "backend-config" (non-sensitive config from SSM Parameter Store).
#
# Flow: Terraform → SSM parameters under /ecoloop/prod/*
#       → ESO → ConfigMap backend-config → Deployment envFrom → container env
#
# Split architecture:
# - backend-env (Secret)     — Secrets Manager (credentials, JWT, DATABASE_URL)
# - backend-config (ConfigMap) — SSM (NODE_ENV, URLs, feature flags, etc.)
#
# Create matching parameters in AWS (e.g. /ecoloop/prod/NODE_ENV). Types: String or SecureString
# (ESO reads values; use String for non-secret config per your security policy).
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-config
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore
    kind: ClusterSecretStore
  target:
    name: backend-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      # Renders a ConfigMap (not a Secret) for non-sensitive keys from SSM
      type: ConfigMap
  data:
    - secretKey: S3_BUCKET_NAME
      remoteRef:
        key: /ecoloop/prod/s3_bucket
    - secretKey: RDS_ENDPOINT
      remoteRef:
        key: /ecoloop/prod/rds_endpoint
