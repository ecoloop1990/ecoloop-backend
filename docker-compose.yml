version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecoloop-postgres
    environment:
      POSTGRES_USER: ecoloop
      POSTGRES_PASSWORD: ecoloop_password
      POSTGRES_DB: ecoloop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoloop"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecoloop-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://ecoloop:ecoloop_password@postgres:5432/ecoloop?schema=public
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-ecoloop-images}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://localhost:8000}
      AI_SERVICE_TIMEOUT: 3000
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: npm run dev

volumes:
  postgres_data:

